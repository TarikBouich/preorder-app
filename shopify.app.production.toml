# Production app (hosted on Render). Deploy with:
#   shopify app deploy --config production
# Local development uses shopify.app.preorder-manager.toml instead.

client_id = "9e4affc129bc14ae2bf8ca10e7e26880"
name = "preorder-manager"
application_url = "https://preorder-manager.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products"

[auth]
redirect_urls = [ "https://preorder-manager.onrender.com/api/auth" ]

[webhooks]
api_version = "2027-01"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[build]
# Never point production at a local dev tunnel.
automatically_update_urls_on_dev = false
