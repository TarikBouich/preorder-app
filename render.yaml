# Render Blueprint: Render → New → Blueprint → pick this repo.
# Secrets marked `sync: false` are entered in the Render dashboard.
services:
  - type: web
    name: preorder-manager
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    # Applies database migrations, then starts the server on $PORT.
    startCommand: npm run setup && npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCOPES
        value: read_products,write_products
      - key: SHOPIFY_API_KEY # production app's Client ID
        sync: false
      - key: SHOPIFY_API_SECRET # production app's Client secret
        sync: false
      - key: SHOPIFY_APP_URL # e.g. https://preorder-manager.onrender.com
        sync: false
      - key: DATABASE_URL # Neon pooled connection string
        sync: false
      - key: DIRECT_URL # Neon direct connection string
        sync: false
